.presets button{font-weight:600}

#tip{position:absolute;pointer-events:none;z-index:10;max-width:26rem;border-radius:4px;background:#111827;padding:4px 8px;font-size:12px;line-height:16px;color:#f3f4f6;display:none}
#tip .m{color:#9ca3af}
#hud{position:absolute;left:10px;bottom:10px;z-index:9;font-size:12px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:4px 8px;color:#374151;display:none}
#hud button{font-size:11px;padding:1px 8px;margin-left:6px}
#dock{position:absolute;right:10px;top:10px;width:300px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;font-size:12px;box-shadow:0 10px 15px rgba(0,0,0,.12);z-index:9;display:none}
#dock.pinned{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.25),0 10px 15px rgba(0,0,0,.12)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crumb{font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.badge{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#fff;border-radius:99px;padding:2px 8px}

.name{text-align:center;font-size:21px;font-weight:650;margin-top:8px;line-height:1.2;overflow-wrap:anywhere}
pre.sig{margin:10px 0 0;background:#f3f4f6;border-radius:4px;padding:8px;font:12px ui-monospace,monospace;white-space:pre-wrap;color:#1f2937}
.pos{text-align:center;font-size:12px;color:#6b7280;margin-top:6px}
.sect{margin-top:12px;border-top:1px solid #e5e7eb;padding-top:10px}
.hdr2{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hdr2 b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 10px;font-size:12px}.seg button+button{border-left:1px solid #d1d5db}
.kr{border-radius:6px}.kr.on{background:#eff6ff;outline:1px solid #2563eb}
.kr-h{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:6px 8px;cursor:pointer;font-size:13px;border-radius:6px;color:#111827}
.kr:not(.on) .kr-h:hover{background:#f3f4f6}
.chev{color:#6b7280;margin-left:6px;font-size:10px;display:inline-block}.kr.on .chev{transform:rotate(90deg)}
.k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.names{display:none;padding:0 8px 8px 22px;font-size:12px}.kr.on .names{display:block}
.nm{font-family:ui-monospace,monospace;padding:2px 0;display:flex;justify-content:space-between;gap:8px;cursor:pointer;color:#1f2937}

.more{color:#6b7280;font-size:11px;padding-top:2px}
.ext{font-size:11px;color:#9ca3af;margin-top:8px;display:flex;justify-content:space-between}
.hint{font-size:10px;color:#9ca3af;text-align:right;margin-top:6px}
kbd{font:10px ui-monospace,monospace;border:1px solid #d1d5db;border-bottom-width:2px;border-radius:3px;padding:0 3px}
.fitbtn{width:100%;margin-top:8px}

  const prevOn = V === 1 && !S.cat && S.preview;
  const focus = S.cat ? visibleEdges() : prevOn ? pe.filter(e => e.kind === S.preview && (S.dir === 'out' ? e.from === S.pin : e.to === S.pin)) : [];
  const hard = S.cat ? focus : [], fs = new Set(focus);
  const lw = w => w / T.k * Math.max(1, Math.min(T.k / fit, 2.5));
  const rgb = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
  const grad = (a, b, c) => { const [r, g, bl] = rgb(c), gr = ctx.createLinearGradient(a.x, a.y, b.x, b.y); gr.addColorStop(0, `rgba(${r},${g},${bl},.12)`); gr.addColorStop(1, `rgba(${r},${g},${bl},1)`); return gr; };
  const dirCol = e => e.from === S.pin ? '#2563eb' : '#ea580c';
  const edge = (e, alpha, w, color, head, gradient) => {
    const a = N[e.from], b = N[e.to]; ctx.globalAlpha = gradient ? 1 : alpha; ctx.lineWidth = lw(w); ctx.fillStyle = color;
    const [cp] = edgePath(a, b); ctx.strokeStyle = gradient ? grad(a, b, color) : color; ctx.stroke(); if (head) { ctx.globalAlpha = alpha; arrow(cp, b, (w > 1.5 ? 11 : 8) / T.k); }
  };
  const context = pe.filter(e => !fs.has(e));
  if (!focus.length) {                                        // freshly pinned: everything
    for (const e of pe) {
      if (V === 1) edge(e, .5, 1.3, KINDS[e.kind].color, true);
      else if (V === 2) edge(e, .55, 1.3, dirCol(e), true);
      else edge(e, 1, 1.8, KINDS[e.kind].color, false, true);
    }
    if (V === 2) for (const e of pe) { const o = e.from === S.pin ? e.to : e.from; ctx.globalAlpha = 1; ctx.strokeStyle = dirCol(e); ctx.lineWidth = lw(1.6); ctx.beginPath(); ctx.arc(N[o].x, N[o].y, r0 + 3 / T.k, 0, TAU); ctx.stroke(); }
  } else {                                                    // a category (or a hovered row in A) is emphasised
    for (const e of context) {
      if (V === 1) edge(e, .1, 1, KINDS[e.kind].color, false);
      else if (V === 3) edge(e, .3, 1, '#9ca3af', false);
    }
    for (const e of focus) { if (V === 3) edge(e, 1, 2.6, KINDS[e.kind].color, false, true); else edge(e, .95, 2.2, KINDS[e.kind].color, true); }
  }
  // pinned ring, target rings
  if (S.pin != null) {
    ctx.globalAlpha = 1;
    if (S.cat) for (const e of hard) { const o = S.dir === 'out' ? e.to : e.from; ctx.strokeStyle = KINDS[e.kind].color; ctx.lineWidth = 2 / T.k; ctx.beginPath(); ctx.arc(N[o].x, N[o].y, r0 + 3 / T.k, 0, TAU); ctx.stroke(); }
    const p = N[S.pin]; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111827'; ctx.lineWidth = 2.5 / T.k; ctx.beginPath(); ctx.arc(p.x, p.y, r0 + 4 / T.k, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, r0, 0, TAU); ctx.fill();
  }
  if (hov && hov.sym != null && hov.sym !== S.pin) { const p = N[hov.sym]; ctx.globalAlpha = 1; ctx.strokeStyle = '#111827'; ctx.lineWidth = 2 / T.k; ctx.beginPath(); ctx.arc(p.x, p.y, r0 + 3 / T.k, 0, TAU); ctx.stroke(); }
  ctx.restore();
  if (V === 3 && S.pin != null) {
    const ids = new Set(); (focus.length ? focus : pe).forEach(e => { ids.add(e.from); ids.add(e.to); }); ids.delete(S.pin);
    if (ids.size <= 14) { ctx.font = '11px ui-sans-serif,system-ui,sans-serif'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
      for (const i of ids) { const sx = N[i].x * T.k + T.x, sy = N[i].y * T.k + T.y; if (sx < 0 || sy < 0 || sx > W - CARD_W + 30 || sy > H) continue; const s = N[i].name;
        ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.strokeText(s, sx + 8, sy); ctx.fillStyle = '#111827'; ctx.fillText(s, sx + 8, sy); } }
  }
  // off-screen chip (Option 2 flavour; shown for any mode that doesn't auto-fit)
  let off = 0;
  if (S.pin != null && S.cat && state.camera !== 'fit') for (const e of hard) { const o = S.dir === 'out' ? e.to : e.from, sx = N[o].x * T.k + T.x, sy = N[o].y * T.k + T.y; if (sx < 0 || sy < 0 || sx > W - CARD_W + 30 || sy > H) off++; }
  if (off) { hud.style.display = 'block'; hud.innerHTML = `${off} of ${hard.length} connections off-screen <button id="hudfit">Fit</button>`; document.getElementById('hudfit').onclick = fitSelection; } else hud.style.display = 'none';
}
function fitSelection() { if (S.pin == null) return; const ids = [S.pin, ...visibleEdges().map(e => e.from === S.pin ? e.to : e.from)]; if (!T0) T0 = { ...T }; tweenTo(fitTo(ids)); }

// ---------- card (decided design: B2)
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const KIND_COLOR = { function: '#7c3aed', variable: '#6b7280', class: '#d97706', interface: '#0891b2', type_alias: '#db2777', enum: '#059669' };
function head(i, pinned) {
  const n = N[i], f = fileOfSym.get(i), k = f.syms.indexOf(i) + 1;
  return `<div class="top"><span class="crumb">${esc(n.path.replace(/\//g, ' / '))}</span><span class="right"><span class="badge" style="background:${KIND_COLOR[n.tip.kind] || '#6b7280'}">${esc(n.tip.kind.replace('_', ' '))}</span>${pinned ? '<button class="x" data-act="unpin" title="Unpin (Esc)">×</button>' : ''}</span></div>
  <div class="name">${esc(n.name)}</div><pre class="sig">${esc(n.tip.signature)}</pre><div class="pos">${ord(k)} of ${f.syms.length} symbols in file</div>`;
}
function renderCard() {
  if (S.pin == null) { dock.className = ''; dock.style.pointerEvents = 'none';
    if (hov && hov.sym != null) { dock.style.display = 'block'; dock.innerHTML = head(hov.sym, false); } else if (!dock.innerHTML) dock.style.display = 'none'; return; }
  const i = S.pin, o = outs.get(i), inn = ins.get(i); dock.className = 'pinned'; dock.style.display = 'block'; dock.style.pointerEvents = 'auto';
  const list = S.dir === 'out' ? o : inn, groups = {}; list.forEach(e => (groups[e.kind] = groups[e.kind] || []).push(e));
  const rows = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([kind, es]) => {
    const names = es.slice(0, 5).map(e => { const t = S.dir === 'out' ? e.to : e.from; return `<div class="nm" data-pin="${t}">${esc(N[t].name)}<span>${esc(N[t].path.split('/').pop())}</span></div>`; }).join('') + (es.length > 5 ? `<div class="more">+ ${es.length - 5} more</div>` : '');
    return `<div class="kr ${S.cat === kind ? 'on' : ''}"><button class="kr-h" data-cat="${kind}"><span><i class="k" style="background:${KINDS[kind].color}"></i>${KINDS[kind][S.dir]}</span><span><b>${es.length}</b><span class="chev">▶</span></span></button><div class="names">${names}</div></div>`;
  }).join('') || '<div class="more" style="padding:6px 8px">No connections in this direction.</div>';
  dock.innerHTML = head(i, true) + `<div class="sect"><div class="hdr2"><b>Connections</b><span class="seg"><button class="${S.dir === 'out' ? 'on' : ''}" data-dir="out">Out ${o.length}</button><button class="${S.dir === 'in' ? 'on' : ''}" data-dir="in">In ${inn.length}</button></span></div>${rows}
  ${state.camera === 'manual' && S.cat ? '<button class="fitbtn" data-act="fit">Fit to connections</button>' : ''}
  <div class="ext"><span>+ ${extCount.get(i)} external / unresolved</span><span>not drawn</span></div><div class="hint"><kbd>Esc</kbd> clears category, again unpins</div></div>`;
}
dock.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-dir],[data-act],[data-pin]'); if (!t) return;
  if (t.dataset.dir) { S.dir = t.dataset.dir; S.cat = null; restoreCamera(); }
  else if (t.dataset.cat) selectCat(S.cat === t.dataset.cat ? null : t.dataset.cat);
  else if (t.dataset.pin) pinSym(+t.dataset.pin);
  else if (t.dataset.act === 'unpin') unpin();
  else if (t.dataset.act === 'fit') fitSelection();
  renderCard(); draw();
});

dock.addEventListener('mouseover', e => { const c = e.target.closest('[data-cat]'), k = c ? c.dataset.cat : null; if ((S.preview || null) !== k) { S.preview = k; draw(); } });
dock.addEventListener('mouseleave', () => { if (S.preview) { S.preview = null; draw(); } });
// ---------- actions
function restoreCamera() { if (state.camera === 'fit' && T0) { tweenTo(T0); T0 = null; } }
function pinSym(i) { if (i === S.pin) return; S.pin = i; S.cat = null; S.dir = 'out'; if (!outs.get(i).length && ins.get(i).length) S.dir = 'in'; restoreCamera(); renderCard(); draw(); }
function selectCat(k) { S.cat = k; if (k) { if (state.camera === 'fit') fitSelection(); } else restoreCamera(); }
function unpin() { restoreCamera(); S.pin = null; S.cat = null; dock.innerHTML = ''; dock.style.display = 'none'; renderCard(); draw(); }
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (S.cat) { S.cat = null; restoreCamera(); renderCard(); draw(); } else if (S.pin != null) unpin(); });

// ---------- pointer: click vs drag (4px threshold)
function toLayout(ev) { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - T.x) / T.k, (ev.clientY - r.top - T.y) / T.k]; }
function pick(x, y) {
  const reach = Math.max(5, 2.6 / T.k) + 3 / T.k; let best = null, bd = Infinity;
  for (const i of syms) { const d = Math.hypot(N[i].x - x, N[i].y - y); if (d <= reach && d < bd) { bd = d; best = i; } }
  if (best != null) return { sym: best };
  const r = Math.hypot(x, y), ang = (Math.atan2(x, -y) + TAU) % TAU;
  for (let i = bands.length - 1; i >= 0; i--) { const b = bands[i]; if (r < b.inner || r > b.outer) continue; for (const a of [ang, ang - TAU]) if (a >= b.a0 && a <= b.a1) return { band: i }; }
  return null;
}
function relation(h) { // how the hovered symbol connects to the pinned one
  const out = (outs.get(S.pin) || []).filter(e => e.to === h).map(e => `${KINDS[e.kind].out} →`), inn = (ins.get(S.pin) || []).filter(e => e.from === h).map(e => `← ${KINDS[e.kind].in}`);
  return [...out, ...inn].join(' · ');
}
function showTip(h, ev) {
  const r = box.getBoundingClientRect(); let html = '';
  if (h.sym != null) { const n = N[h.sym]; html = `<b>${esc(n.name)}</b> <span class="m">${esc(n.tip.kind)} · ${esc(n.path)}</span>`; if (S.pin != null && h.sym !== S.pin) { const rel = relation(h.sym); html += `<div class="m">${rel ? 'pinned symbol: ' + esc(rel) : 'not connected to the pinned symbol'}</div>`; } }
  else { const b = bands[h.band]; html = `<span class="m">${b.tier}</span> ${esc(N[b.owner].path || N[b.owner].name)}`; }
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - tip.offsetWidth - 4) + 'px'; tip.style.top = Math.min(ev.clientY - r.top + 14, r.height - tip.offsetHeight - 4) + 'px';
}
let drag = null, moved = false;
cv.addEventListener('mousedown', e => { cancelAnimationFrame(anim); drag = { x: e.clientX, y: e.clientY, tx: T.x, ty: T.y }; moved = false; });
addEventListener('mouseup', e => { if (!drag) return; const was = moved; drag = null; if (was || e.target !== cv) return;
  const [x, y] = toLayout(e), h = pick(x, y);
  if (h && h.sym != null) pinSym(h.sym);
  else if (!h || h.band != null) { if (state.emptyClick === 'unpin' && S.pin != null) unpin(); } });
cv.addEventListener('mousemove', e => {
  if (drag) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) moved = true; if (moved) { T.x = drag.tx + e.clientX - drag.x; T.y = drag.ty + e.clientY - drag.y; tip.style.display = 'none'; draw(); } return; }
  const [x, y] = toLayout(e), h = pick(x, y);
  const ignore = S.pin != null && state.hoverPinned === 'ignore';
  hov = ignore ? null : h; cv.classList.toggle('ptr', !!(h && h.sym != null));
  if (ignore || !h) tip.style.display = 'none'; else showTip(h, e);
  if (S.pin == null) renderCard(); draw();
});
cv.addEventListener('mouseleave', () => { hov = null; tip.style.display = 'none'; draw(); });
cv.addEventListener('wheel', e => { e.preventDefault(); cancelAnimationFrame(anim); const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const k = Math.max(fit / 4, Math.min(40, T.k * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)))), f = k / T.k; T.x = px - (px - T.x) * f; T.y = py - (py - T.y) * f; T.k = k; draw(); }, { passive: false });

// ---------- header controls
const desc = document.getElementById('desc'); let preset = 1;
function sync() { document.querySelectorAll('button[data-k]').forEach(b => b.classList.toggle('on', state[b.dataset.k] === b.dataset.v));
  document.querySelectorAll('button[data-p]').forEach(b => b.classList.toggle('on', +b.dataset.p === preset)); desc.textContent = preset ? PRESETS[preset].desc : 'Custom mix of the toggles below.'; }
document.querySelectorAll('button[data-p]').forEach(b => b.onclick = () => { preset = +b.dataset.p; Object.assign(state, PRESETS[preset]); delete state.desc; T0 && restoreCamera(); sync(); renderCard(); draw(); });
document.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { state[b.dataset.k] = b.dataset.v; sync(); renderCard(); draw(); });
sync(); resize();
// start with a connected, mid-size symbol pinned? no: leave empty so the first click is yours.
</script></body></html>
