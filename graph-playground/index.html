<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Graph Tuning Bench</title>
<!--
  Graph Tuning Bench v1 — Concept A (priority stack)

  A standalone harness for dialing in how a graph view behaves, then emitting the tuning back into
  lib/analysis/graph-config.ts. Open this file directly (file://) — no build step, no backend.
  d3 v7 loads from a CDN; the graph comes from the frozen snapshot in ./data.js.

  The three v1 decisions (edge-kind source of truth, config-emit format, snapshot contract) are
  recorded in the "notes" panel inside the bench (top-right of the canvas) and in the NOTES
  template near the bottom of this file.

  Regenerate the snapshot:  npx tsx scripts/dump-analysis.ts
-->
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a; --line2:#3a4150;
    --text:#e6e9ef; --muted:#9aa3b2; --dim:#6b7382;
    --accent:#4f8cff; --accent-bg:#12203a;
    --ok:#3ecf8e; --ok-bg:#0f2620;
    --warn:#e0a34a; --warn-bg:#2a2113;
    --lock:#7c8797;
    --rail:340px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;}
  a{color:var(--accent);}
  button{font:inherit;color:inherit;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* ── two-region frame ─────────────────────────────── */
  .app{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--rail);height:100vh;overflow:hidden;}
  .stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:
    radial-gradient(circle, #1a1e27 1px, transparent 1px) 0 0/26px 26px, var(--panel);}
  .stage[data-canvas="light"]{background:#fff;}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
  canvas#cv.grabbing{cursor:grabbing;}
  .hud{position:absolute;top:12px;left:14px;color:var(--muted);font:11px ui-monospace,monospace;pointer-events:none;line-height:1.6;}
  .hud .sim{color:var(--dim);}
  .hud .sim.hot{color:var(--warn);}
  .stage[data-canvas="light"] .hud{color:#4b5563;}
  .ghost{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);font-size:12px;text-align:center;padding:40px;pointer-events:none;}
  .legend{position:absolute;bottom:12px;left:14px;right:14px;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:11px;pointer-events:none;}
  .stage[data-canvas="light"] .legend{color:#4b5563;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .stage-tools{position:absolute;top:10px;right:12px;display:flex;gap:6px;}
  .tbtn{font-size:10.5px;border:1px solid var(--line2);border-radius:6px;padding:4px 10px;color:var(--muted);background:var(--panel);cursor:pointer;}
  .tbtn:hover{color:var(--text);border-color:var(--accent);}
  .tbtn[aria-pressed="true"]{color:var(--text);border-color:var(--accent);background:var(--accent-bg);}
  #tip{position:absolute;z-index:5;display:none;pointer-events:none;background:#1f2937;color:#f9fafb;padding:6px 10px;
    border-radius:4px;font-size:12px;max-width:340px;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  #tip .t2{color:#9ca3af;font:10.5px ui-monospace,monospace;margin-top:2px;word-break:break-all;}

  /* ── rail ─────────────────────────────────────────── */
  .rail{min-height:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;}
  .rail-top{padding:10px 10px 0;flex:0 0 auto;}
  .rail-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 10px 4px;}
  .rail-scroll::-webkit-scrollbar{width:8px;} .rail-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;}

  /* preset switcher (top bar) */
  .preset{margin-bottom:9px;}
  .preset .plabel{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:flex;align-items:center;}
  .preset .plabel .tag{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--muted);}
  .switch{display:flex;align-items:center;gap:6px;}
  .cyc{width:22px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:1px solid var(--line2);border-radius:6px;background:var(--panel2);color:var(--muted);font-size:13px;padding:0;}
  .cyc:hover{color:var(--text);border-color:var(--accent);}
  .selwrap{flex:1;position:relative;height:26px;}
  .selwrap select{width:100%;height:26px;appearance:none;-webkit-appearance:none;padding:0 22px 0 9px;cursor:pointer;
    border:1px solid var(--accent);border-radius:6px;background:var(--accent-bg);color:var(--text);font:600 11.5px ui-sans-serif,system-ui,sans-serif;}
  .selwrap .car{position:absolute;right:9px;top:0;height:26px;display:flex;align-items:center;color:var(--muted);font-size:9px;pointer-events:none;}
  .newp{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:1px dashed var(--line2);border-radius:6px;background:var(--panel);color:var(--accent);font-size:14px;padding:0;}
  .newp:hover{border-color:var(--accent);}
  .presethint{font-size:9px;color:var(--dim);margin-top:4px;display:flex;gap:8px;align-items:center;min-height:13px;}
  .presethint .lnk{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font-size:9px;}

  /* color-banded surfaces */
  .band{border-radius:9px;padding:9px 10px;margin-bottom:9px;}
  .b1{background:var(--accent-bg);} .b2{background:var(--ok-bg);} .b3{background:var(--warn-bg);}
  .hd{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;margin-bottom:7px;}
  .p1t{color:#9cc0ff;} .p2t{color:#8fe3c0;} .p3t{color:#f0c987;}
  .num{font-size:10px;font-weight:600;border-radius:20px;padding:1px 7px;background:var(--panel2);color:var(--muted);}
  .cost{margin-left:auto;font-size:9px;font-weight:600;border-radius:20px;padding:1px 7px;background:var(--panel2);transition:box-shadow .2s;}
  .cost.build{color:#9cc0ff;border:1px solid #294066;}
  .cost.draw{color:#8fe3c0;border:1px solid #1f5140;}
  .cost.heat{color:#f0c987;border:1px solid #5c4620;}
  .cost.pulse{animation:pulse .7s ease-out;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 currentColor;}100%{box-shadow:0 0 0 7px transparent;}}
  .sub{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 3px;}
  .sub:first-child{margin-top:0;}

  /* live controls: checkbox rows */
  .r{position:relative;display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2.5px 0;color:var(--text);cursor:pointer;user-select:none;}
  .r input{position:absolute;opacity:0;width:0;height:0;}
  .cb{width:12px;height:12px;border:1px solid var(--line2);border-radius:3px;flex:0 0 auto;background:transparent;}
  .r input:checked + .cb{background:var(--accent);border-color:var(--accent);}
  .b2 .r input:checked + .cb{background:var(--ok);border-color:var(--ok);}
  .r input:focus-visible + .cb{outline:2px solid #fff;outline-offset:1px;}
  .r.dis{cursor:not-allowed;opacity:.5;}
  .cnt{margin-left:auto;font:9.5px ui-monospace,monospace;color:var(--dim);white-space:nowrap;}
  .fold{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 0;color:var(--text);cursor:pointer;user-select:none;}
  .fold .chev{color:var(--muted);font-size:11px;width:11px;text-align:center;}
  .fold .s{margin-left:auto;font:9.5px ui-monospace,monospace;color:var(--dim);}
  .foldbody{margin:0 0 3px 17px;border-left:1px solid var(--line2);padding-left:8px;}
  .foldact{font-size:9.5px;color:var(--muted);margin:1px 0 2px;display:flex;gap:8px;}
  .foldact button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:9.5px;}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;}
  .seg button{background:var(--panel2);border:0;border-right:1px solid var(--line2);padding:2px 8px;font-size:10px;color:var(--dim);cursor:pointer;}
  .seg button:last-child{border-right:0;}
  .seg button.on{color:var(--text);background:#2b3a55;}
  .b2 .seg button.on{background:#1f4a3b;} .b3 .seg button.on{background:#4a3a1a;}
  .rowline{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2.5px 0;}
  .rowline .nm{flex:1;}

  /* code-vs-live seam: locked rows */
  .lock{display:block;font:9.5px ui-monospace,monospace;color:var(--lock);
    border-top:1px dashed var(--line2);margin-top:7px;padding-top:6px;}
  .lock .lh{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .lock .lk{font-size:10px;}
  .lock .edit{margin-left:auto;font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;color:var(--accent);}
  .lock ul{margin:4px 0 0;padding:0 0 0 16px;line-height:1.55;}
  .lock li{margin:0;}
  .lock .more{color:var(--dim);}

  /* area overlay tree */
  .tree{max-height:128px;overflow-y:auto;margin:0 -4px;padding:0 4px;}
  .tree::-webkit-scrollbar{width:6px;} .tree::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}
  .arow{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 0;min-height:21px;}
  .arow .chev{width:11px;text-align:center;color:var(--muted);font-size:10px;cursor:pointer;flex:0 0 auto;}
  .eye{width:16px;flex:0 0 auto;color:var(--dim);font-size:12px;text-align:center;cursor:pointer;background:none;border:0;padding:0;line-height:1;}
  .eye.on{color:var(--text);} .eye.mixed{color:var(--ok);}
  .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto;}
  .arow .nm{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .arow.off .nm{color:var(--dim);}
  .arow .cnt{margin-left:auto;}
  .solo{display:none;font-size:9px;color:var(--accent);cursor:pointer;background:none;border:0;padding:0 0 0 4px;}
  .arow:hover .solo,.arow .solo.active{display:inline;}
  .arow:hover .cnt{margin-left:0;}
  .arow .solo.active{color:var(--ok);}
  .forces{font:9.5px ui-monospace,monospace;color:var(--muted);line-height:1.55;margin-top:2px;}

  /* P3: tabs, sliders */
  .tabs{display:flex;gap:3px;margin-bottom:7px;}
  .tab{flex:1;text-align:center;font-size:9.5px;font-weight:600;padding:5px 1px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);color:var(--dim);background:var(--panel2);}
  .tab.act{border-color:#5c4620;color:#f0c987;background:#1e222b;}
  .grphd{display:flex;align-items:center;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 3px;}
  .grphd:first-of-type{margin-top:0;}
  .rst{margin-left:auto;font-size:9px;color:var(--accent);text-transform:none;letter-spacing:0;cursor:pointer;background:none;border:0;padding:0;}
  .sl{display:grid;grid-template-columns:66px 1fr 44px;gap:7px;align-items:center;padding:2px 0;}
  .sl .lb{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sl .vv{font:9.5px ui-monospace,monospace;color:var(--muted);text-align:right;}
  .sl .bd{font:8.5px ui-monospace,monospace;color:var(--dim);grid-column:2;margin-top:-3px;}
  .sl.col input[type=color]{width:100%;height:20px;padding:0;border:1px solid var(--line2);border-radius:4px;background:transparent;cursor:pointer;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--line2);border-radius:3px;outline:none;width:100%;margin:5px 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--warn);cursor:pointer;border:0;}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--warn);cursor:pointer;border:0;}
  input[type=range]:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  /* footer: config emit */
  .foot{flex:0 0 auto;background:var(--panel2);border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px;position:relative;}
  .foot .code{flex:1;min-width:0;font:10px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .foot .code:hover{color:var(--text);}
  .foot .half{position:absolute;left:10px;top:-8px;font-size:8.5px;color:var(--dim);background:var(--panel2);padding:0 5px;border-radius:5px;border:1px solid var(--line);}
  .acts{display:flex;gap:6px;flex:0 0 auto;}
  .btn{font-size:10.5px;border:1px solid var(--line2);border-radius:6px;padding:4px 10px;color:var(--muted);background:var(--panel);cursor:pointer;}
  .btn:hover{color:var(--text);border-color:var(--accent);}
  .btn.pri{color:var(--text);border-color:var(--accent);background:var(--accent-bg);}

  /* floating panels (emit, notes) */
  .panel{position:absolute;z-index:20;display:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.55);}
  .panel.open{display:flex;flex-direction:column;}
  .panel header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:12px;}
  .panel header .x{margin-left:auto;cursor:pointer;color:var(--muted);background:none;border:0;font-size:14px;}
  #emitPanel{right:8px;bottom:52px;width:min(780px,calc(100vw - 16px));max-height:min(70vh,640px);}
  #emitPanel pre{margin:0;padding:12px;overflow:auto;font:11px/1.5 ui-monospace,monospace;color:#cdd5e2;flex:1;white-space:pre;tab-size:2;}
  #notesPanel{top:44px;right:calc(var(--rail) + 12px);width:min(620px,calc(100vw - var(--rail) - 24px));max-height:calc(100vh - 64px);}
  #notesPanel .body{overflow:auto;padding:4px 14px 14px;font-size:12px;color:var(--muted);}
  #notesPanel h4{margin:14px 0 4px;font-size:12px;color:var(--text);}
  #notesPanel p,#notesPanel ul{margin:4px 0;}
  #notesPanel code,#notesPanel pre{font:11px ui-monospace,monospace;color:#cdd5e2;}
  #notesPanel pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;margin:6px 0;}
  #fatal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;background:var(--bg);color:var(--text);}
  #fatal code{font:12px ui-monospace,monospace;color:var(--warn);}
  @media (max-width:760px){ .app{grid-template-columns:1fr;grid-template-rows:55vh 1fr;height:auto;min-height:100vh;} .rail{border-left:none;border-top:1px solid var(--line);} #notesPanel{right:8px;} }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage" data-canvas="light">
    <canvas id="cv" aria-label="Graph canvas"></canvas>
    <div class="hud" id="hud"></div>
    <div class="ghost" id="ghost"></div>
    <div class="legend" id="legend"></div>
    <div class="stage-tools">
      <button class="tbtn" id="fitBtn" title="zoom to fit the working set">fit</button>
      <button class="tbtn" id="notesBtn" aria-pressed="false" title="decisions, snapshot contract, emit format">notes</button>
    </div>
    <div id="tip"></div>
  </div>

  <aside class="rail" aria-label="Tuning rail">
    <div class="rail-top">
      <div class="preset" id="preset"></div>
    </div>
    <div class="rail-scroll">
      <section class="band b1" id="p1" aria-label="P1 available data"></section>
      <section class="band b2" id="p2" aria-label="P2 display"></section>
      <section class="band b3" id="p3" aria-label="P3 tune"></section>
    </div>
    <footer class="foot" id="foot"></footer>
  </aside>

  <div class="panel" id="emitPanel" role="dialog" aria-label="Config emit"></div>
  <div class="panel" id="notesPanel" role="dialog" aria-label="Bench notes"></div>
  <div id="fatal"></div>
</div>

<template id="NOTES">
  <p>The bench tunes <b>one preset at a time</b> against a frozen snapshot. Every control is either <b>live</b> (yours to change) or a <b>locked row</b> that reflects policy owned by code — never a dead control. Bands are ordered by priority = frequency = recompute cost: <b>P1 rebuild</b> (re-filters the working set, re-runs the layout) → <b>P2 redraw</b> (no physics) → <b>P3 reheat</b> (nudges the running simulation).</p>

  <h4>Decision 1 · edge-kind source of truth</h4>
  <p>There is exactly one edge-kind on-set per preset (<code>live.edgeKinds</code>). It drives both the working-set filter and what is drawn, so nothing is "declared real" yet never rendered. Every node type and edge kind present in the snapshot is an independent multi-select toggle in P1 (INSTANTIATES included). The on-set is <b>seeded from the selected preset's real view config</b>, not from a bench-local constant:</p>
  <ul>
    <li><b>Internal Processing</b> — nodes FUNCTION·METHOD·CLASS (∧ cross-file reference); edges every kind, internal only (<code>!isExternal</code>).</li>
    <li><b>Modules</b> — nodes FUNCTION·METHOD; edges CALLS, internal only.</li>
    <li><b>Data Flow</b> — nodes FUNCTION·METHOD·CLASS·INTERFACE·TYPE_ALIAS; edges every kind except IMPORTS, internal only.</li>
  </ul>
  <p>Toggling further types/kinds is the experiment: pull one in, read the count, see its blast radius, then fold the winning set back into code. External edges are a bench-only preview (they draw hollow stubs); <code>RepoGraph.tsx</code> drops any edge whose target is not a candidate node.</p>

  <h4>Decision 2 · config-emit format &amp; code-half boundary</h4>
  <p>The footer emits <b>half</b> of a view config: the live half. The other half is code — the policy in <code>lib/analysis/graph-config.ts</code> (filter predicates, role→color, the edge-force model, the tunable groups) plus the bounds in this file's <code>PARAM_DEFS</code>. Two forms of the same value, both from the footer:</p>
  <ul>
    <li><b>tuning</b> — <code>{ preset, base, filters: { nodeTypes, edgeKinds, includeExternal, … }, params: { …flat P() magnitudes… } }</code> with a header comment that names the code half and the exact <code>RepoGraphConfig</code> field each param maps to.</li>
    <li><b>view config (TS)</b> — that value pushed through the mapping into a <code>create…ViewConfig</code>-shaped function/const built with <code>mergeConfigs</code>, <code>scaledValue</code>, <code>createEdgeForcer</code> from <code>graph-config.ts</code>. Nothing in <code>graph-config.ts</code> has to change for the mapping to be faithful.</li>
  </ul>
  <p><b>Presets.</b> A preset is one full config: its policy fills the locked rows, its defaults fill the live controls (P1 on-sets, P3 magnitudes). <b>+ fork</b> snapshots the current live settings as a new session-local preset (same policy, new defaults); it emits through the same path and becomes permanent only when the emitted config is pasted into <code>graph-config.ts</code>. P2 display toggles are bench-only inspection and are not emitted. <i>reset all</i> restores the selected preset's defaults.</p>

  <h4>Decision 3 · snapshot contract</h4>
  <p><code>data.js</code> sets <code>window.GRAPH_SNAPSHOT</code>. A target graph must provide:</p>
  <pre>{ version, metadata: { repoName, commit, generatedAt, … },
  nodes:     [{ id, name, type, file, line, exported, test, xfile, refsIn, refsOut }],
  edges:     [{ kind, from, to, external }],   // from → nodes[]; to → nodes[] (or externals[] when external)
  externals: [{ name, pkg }],
  areas:     [{ id, name, parent, color, contains: [node index…] }] }</pre>
  <p>Produce it with <code>npx tsx scripts/dump-analysis.ts [repoPath] [outFile]</code> (same SCIP + tree-sitter pipeline as the app). Swap it by regenerating, or by dropping in any <code>data.js</code> with those keys; every count, toggle and tree in the bench is derived from the snapshot.</p>

  <h4>Shipping</h4>
  <p>The bench is one file plus <code>data.js</code>. The app serves it at <code>/graph-playground/index.html</code> (static, via <code>public/</code>) and links to it from the graph toolbar; opening the file directly works the same.</p>
</template>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="data.js"></script>
<script>
(function () {
'use strict';

/* ═══════════════════════════════════════════════════════════════════════════
   0 · bootstrap
   ═══════════════════════════════════════════════════════════════════════════ */
const SNAP = window.GRAPH_SNAPSHOT;
const fatal = (html) => { const f = document.getElementById('fatal'); f.innerHTML = html; f.style.display = 'flex'; };
if (!window.d3) { fatal('<div><b>d3 failed to load.</b><br><br>The bench loads d3 v7 from a CDN — check the network connection.</div>'); return; }
if (!SNAP || !SNAP.nodes) { fatal('<div><b>No snapshot.</b><br><br>Generate <code>graph-playground/data.js</code> with<br><code>npx tsx scripts/dump-analysis.ts</code></div>'); return; }

const $ = (sel, root) => (root || document).querySelector(sel);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'checked' || k === 'value') el[k] = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);

        ? '({ ...DEFAULT_EDGE_STYLE, color: ' + q(p.edgeColor) + ', width: ' + num(p.edgeWidth) + ', opacity: ' + num(p.edgeOpacity) + ', gradientSourceColor: ' + q(p.gradientFrom) + ', gradientTargetColor: ' + q(p.gradientTo) + ' })'
        : edgeStyle()) + ',',
      '    },',
      '    forces: {',
      '      node: (node: AnalysisNode) => ({ ...base.forces.node(node), charge: ' + num(p.charge) + ' }),',
      '      edge: (edge: AnalysisEdge) => ({',
      '        distance: ' + num(p.edgeDistance) + ',',
      '        strength: Math.max(0.05, ' + num(p.edgeStrengthBase) + ' / Math.sqrt(usageByTarget.get(edge.toSymbol) ?? 1)),',
      '      }),',
      '      areaCluster: ' + num(p.areaCluster) + ',',
      '    },',
      sim.replace(/^ {4}/, '    ').replace(/\n$/, ''),
      '  });',
      '}',
      '',
    ];
  }
  return header.concat(common, [''], body).join('\n');
}
function emitText() { return ui.emitTab === 'tuning' ? emitTuning() : emitViewConfig(); }

/* ── footer + emit panel ─────────────────────────────────────────────────────────────────────── */
function copyText(text) {
  const fallback = () => { const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* ignore */ } ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(fallback);
  fallback(); return Promise.resolve();
}
function renderFooter() {
  fill($('#foot'), 
    h('span', { class: 'half', title: 'the emitted value is only half of a view config; the code half is graph-config.ts' }, 'live half · code half → graph-config.ts'),
    h('span', { class: 'code', id: 'codeLine', title: 'click to view the full emit', onclick: toggleEmit }, flatPreview()),
    h('span', { class: 'acts' },
      h('button', { class: 'btn', id: 'resetAll', title: 'restore the selected preset\'s defaults (P1 on-sets, P3 magnitudes, P2 display)', onclick: resetAll }, 'reset all'),
      h('button', { class: 'btn pri', id: 'copyBtn', onclick: (e) => { const b = e.currentTarget; copyText(emitText()).then(() => { b.textContent = 'copied ✓'; setTimeout(() => { b.textContent = 'copy config'; }, 1200); }); } }, 'copy config')));
  if (ui.emitOpen) renderEmit();
}
function toggleEmit() { ui.emitOpen = !ui.emitOpen; renderEmit(); }
function renderEmit() {
  const el = $('#emitPanel'); el.classList.toggle('open', ui.emitOpen);
  if (!ui.emitOpen) return;
  fill(el, 
    h('header', null, 'config emit', h('span', { class: 'seg' }, [['tuning', 'tuning'], ['view', 'view config (TS)']].map(([id, lab]) => h('button', { class: ui.emitTab === id ? 'on' : '', onclick: () => { ui.emitTab = id; renderEmit(); } }, lab))),
      h('span', { style: { color: 'var(--dim)', fontWeight: '400', fontSize: '10.5px' } }, 'half the config — the code is the other half'),
      h('button', { class: 'x', 'aria-label': 'close', onclick: toggleEmit }, '✕')),
    h('pre', { id: 'emitPre' }, emitText()));
}
function resetAll() {
  const P = cur(); P.live = cloneLive(P.defaults);
  disp.showEdges = true; disp.labels = 'preset'; disp.drawOff = new Set(); disp.solo = null;
  for (const a of AREAS) disp.areaVis.set(a.id, true);
  rebuild(true); renderAll(true); pulse('p1'); pulse('p3');
}

/* ── notes panel (decisions 1–3 recorded in the bench) ───────────────────────────────────────── */
function renderNotes() {
  const el = $('#notesPanel'); el.classList.toggle('open', ui.notesOpen);
  $('#notesBtn').setAttribute('aria-pressed', ui.notesOpen ? 'true' : 'false');
  if (!ui.notesOpen) return;
  const m = SNAP.metadata || {};
  fill(el, 
    h('header', null, 'bench notes', h('span', { style: { color: 'var(--dim)', fontWeight: '400', fontSize: '10.5px' } }, 'snapshot ' + (m.repoName || '?') + '@' + (m.commit || '?') + ' · ' + fmtN(N) + ' nodes · ' + fmtN(EDGES.length) + ' edges · ' + AREAS.length + ' areas'),
      h('button', { class: 'x', 'aria-label': 'close', onclick: () => { ui.notesOpen = false; renderNotes(); } }, '✕')),
    (() => { const b = h('div', { class: 'body' }); b.append($('#NOTES').content.cloneNode(true)); return b; })());
}
$('#notesBtn').addEventListener('click', () => { ui.notesOpen = !ui.notesOpen; renderNotes(); });
$('#fitBtn').addEventListener('click', () => fitView(true));

/* ═══════════════════════════════════════════════════════════════════════════
   8 · go
   ═══════════════════════════════════════════════════════════════════════════ */
window.__bench = { presets, cur, live, base, emitTuning, emitViewConfig, emitValue, selectPreset, forkPreset, rebuild, get simNodes() { return simNodes; }, get links() { return links; }, get sim() { return sim; }, SNAP, PARAM_DEFS, BASES, scaledValue, METRICS, disp, areaState, toggleArea };
resize();
rebuild(true);
renderAll();
})();
